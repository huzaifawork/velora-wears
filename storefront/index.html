<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Velora Wears — Premium Fashion, Made to Be Worn</title>
    <meta
      name="description"
      content="Velora Wears is a premium Pakistani fashion label — modern shirts, hoodies and everyday essentials, delivered nationwide with cash on delivery."
    />
    <meta name="theme-color" content="#241d33" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph — the brand as it appears when a product is shared on Instagram. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Velora Wears" />
    <meta property="og:title" content="Velora Wears — Premium Fashion, Made to Be Worn" />
    <meta
      property="og:description"
      content="Modern shirts, hoodies and everyday essentials from a premium Pakistani fashion label."
    />

    <!--
      Brand typefaces (requirements section 1). Playfair Display carries the
      editorial, premium voice; Inter handles UI text. Only the weights actually
      used are requested, and the fonts are preconnected so they do not block
      first paint - requirements section 19.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    />

    <link rel="preconnect" href="https://velora-wears-default-rtdb.asia-southeast1.firebasedatabase.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
